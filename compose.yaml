services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    volumes:
      - ./backend/src:/app/src
    environment:
      # Service name, not localhost: the backend reaches it over the compose
      # network. .env still wins if it sets its own endpoint.
      EMBEDDING_BASE_URL: http://embeddings:8080/v1
    depends_on:
      embeddings:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

  # Vectors for the sqlite search backend, which is the default. Not
  # profile-gated: the default config points here, so gating it would mean
  # `docker compose up` produces a stack whose defaults don't work.
  embeddings:
    build: ./embeddings
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Offline only: `docker compose --profile local-es up`.
  # Note semantic_text needs an inference endpoint configured, so this is not a
  # drop-in substitute for Serverless. See docs/DEVELOP.md.
  elasticsearch:
    profiles: ["local-es"]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports: ["9200:9200"]
