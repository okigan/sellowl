[project]
name = "sellowl"
version = "0.1.0"
description = "Paste your eBay store link. Find out what you're leaving on the table."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "elasticsearch[async]>=8.17",
    "anthropic>=0.40",
    "structlog>=26.1.0",
    "openai>=2.52.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "mutmut>=3.2",
    "respx>=0.21",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sellowl"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Generated by `mutmut run`; not our code.
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]
# En dash is correct typography for a numeric range in user-facing copy
# ("$180–$265"), and that copy is the product.
allowed-confusables = ["–"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["sellowl"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mutmut.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.mutmut]
# The whole package is copied so imports resolve, but only these two files are
# mutated. Scoped on purpose: mutating I/O glue against third-party scrapers
# teaches nothing, while a flipped comparison in pricing silently recommends
# the wrong price. See docs/DEVELOP.md § Quality bar.
source_paths = ["src/sellowl"]
only_mutate = ["src/sellowl/pricing.py", "src/sellowl/match.py"]
pytest_add_cli_args_test_selection = ["tests/"]
